<style>
/* Layout: one phone-width column with a side drawer. The weekly grid has the chosen days as rows and the user's own time slots as columns; the exam table lists each date of the exam period as a row, grouped by week. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --fg:#16202E; --muted:#5B6778; --line:#D5DBE4;
  --accent:#0E7C70; --accent-fg:#FFFFFF; --danger:#B3261E; --danger-bg:#FBE4E2; --today:#E3F1EF;
  --warn-bg:#FFF1CC; --warn-fg:#6A4600;
  --c0b:#CDEBE6; --c0f:#0B4A44; --c1b:#D3E1FA; --c1f:#1B3A78; --c2b:#F6E2B3; --c2f:#6A4600; --c3b:#F7D4DA; --c3f:#7A1F34;
  --c4b:#E1D8F6; --c4f:#43308A; --c5b:#D8E9C5; --c5f:#355A12; --c6b:#F8D9C2; --c6f:#7A3A10; --c7b:#D9DEE6; --c7f:#2E3A4D;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151D; --surface:#18212C; --fg:#E6EBF2; --muted:#93A0B2; --line:#2A3645;
    --accent:#3CC4B2; --accent-fg:#07201C; --danger:#FF8A80; --danger-bg:#3A1D1B; --today:#1A2E2D;
    --warn-bg:#4A3A10; --warn-fg:#F3DFA9;
    --c0b:#14423E; --c0f:#BFE8E1; --c1b:#1D3566; --c1f:#CBDCF9; --c2b:#5B4210; --c2f:#F3DFA9; --c3b:#5E2230; --c3f:#F6CCD4;
    --c4b:#3A2F6B; --c4f:#DDD3F5; --c5b:#2F4A17; --c5f:#D3E6BE; --c6b:#62351B; --c6f:#F6D5BC; --c7b:#343E50; --c7f:#D6DCE6;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#18212C; --fg:#E6EBF2; --muted:#93A0B2; --line:#2A3645;
  --accent:#3CC4B2; --accent-fg:#07201C; --danger:#FF8A80; --danger-bg:#3A1D1B; --today:#1A2E2D;
  --warn-bg:#4A3A10; --warn-fg:#F3DFA9;
  --c0b:#14423E; --c0f:#BFE8E1; --c1b:#1D3566; --c1f:#CBDCF9; --c2b:#5B4210; --c2f:#F3DFA9; --c3b:#5E2230; --c3f:#F6CCD4;
  --c4b:#3A2F6B; --c4f:#DDD3F5; --c5b:#2F4A17; --c5f:#D3E6BE; --c6b:#62351B; --c6f:#F6D5BC; --c7b:#343E50; --c7f:#D6DCE6;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:16px 40px}
*{box-sizing:border-box}
.wrap{max-width:34rem;margin-inline:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input,select{font:inherit;color:inherit}

.c0{background:var(--c0b);color:var(--c0f)} .c1{background:var(--c1b);color:var(--c1f)}
.c2{background:var(--c2b);color:var(--c2f)} .c3{background:var(--c3b);color:var(--c3f)}
.c4{background:var(--c4b);color:var(--c4f)} .c5{background:var(--c5b);color:var(--c5f)}
.c6{background:var(--c6b);color:var(--c6f)} .c7{background:var(--c7b);color:var(--c7f)}

.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top .grow{flex:1;min-width:0}
.top h1{font-family:var(--font-display);font-size:1.4rem;line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);font-size:.82rem;margin-top:2px}
.logo{width:40px;height:40px;flex:none;display:block}
#app{position:relative;z-index:1}
.diag{margin:0;font-size:.72rem;direction:ltr;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;opacity:.85}
.iconbtn,.back{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;flex:none}
.back{padding:0 12px 0 10px}
.iconbtn svg,.back svg,.dr-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
html[dir="ltr"] .back svg{transform:scaleX(-1)}
html[dir="ltr"] .back{padding:0 10px 0 12px}

.btn{min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.danger{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:default}
.acts{display:flex;gap:10px;margin-bottom:14px}
.acts .btn{flex:1}

.note{background:var(--today);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.85rem}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:10px;padding:10px 12px;font-size:.88rem}
.warn .btn{margin-top:8px}

.gridbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin}
.grid{display:grid;gap:1px;background:var(--line)}
.grid>*{min-width:0}
.th,.dh,.cell,.corner{background:var(--surface)}
.th{display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;line-height:1.25}
.th b{font-size:.8rem;font-weight:600}
.th span{font-size:.68rem;color:var(--muted)}
.dh,.corner{position:sticky;inset-inline-start:0;z-index:3;box-shadow:1px 0 0 var(--line)}
html[dir="rtl"] .dh,html[dir="rtl"] .corner{box-shadow:-1px 0 0 var(--line)}
.dh{display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:600;text-align:center;padding:0 2px}
.dh.tod,.cell.tod{background:var(--today)}
.dh.tod{color:var(--accent)}
.block{margin:2px;padding:4px 3px;border:0;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:.76rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere;cursor:pointer;z-index:1}
.block small{font-size:.66rem;font-weight:500;opacity:.9}
.empty{padding:14px 16px;color:var(--muted);font-size:.9rem;text-align:center}
.hint{margin-top:8px;color:var(--muted);font-size:.78rem;text-align:center}

.sec{margin-top:20px}
.sec h3{font-size:.8rem;letter-spacing:.04em;color:var(--muted);margin-bottom:8px;font-weight:600}
.crs{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 12px;margin-bottom:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:pointer;text-align:start}
.crs-n{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.crs-m{color:var(--muted);font-size:.8rem;flex:none}
.dot{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid var(--line)}

form{display:flex;flex-direction:column;gap:6px}
label,.lab{font-size:.85rem;font-weight:500}
.opt{color:var(--muted);font-weight:400}
input,select{width:100%;min-height:46px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:16px}
input[type="checkbox"]{width:20px;min-height:20px;height:20px;flex:none;accent-color:var(--accent)}
select{padding-inline-end:8px}
form>label:not(:first-child){margin-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.lec{margin-top:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.lec-t{font-size:.85rem;font-weight:600;margin-bottom:8px}
.lec-f{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.lec-f label,.lec-r label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);min-width:0}
.lec-f select{padding:0 6px;font-size:15px;color:var(--fg)}
.lec-r{margin-top:8px}
.err{margin-top:12px;padding:10px 12px;background:var(--danger-bg);color:var(--danger);border-radius:10px;font-size:.9rem;font-weight:500}
#sub{margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip button{border:0;background:transparent;cursor:pointer;padding:0 2px;font-size:1rem;line-height:1;opacity:.8}
.chip.plain{background:var(--surface);border:1px solid var(--line)}
#doneWrap{margin-top:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.panel h2{font-size:1rem;font-weight:600}
.panel p{color:var(--muted);font-size:.85rem}
.row-s{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:50px;height:30px;border-radius:999px;border:1px solid var(--line);background:var(--bg);position:relative;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:transparent}
.switch[aria-checked="true"]::after{inset-inline-start:23px;background:var(--accent-fg)}
.add-off{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px;align-items:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{min-height:46px;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}

.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.slot{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.slot label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted);min-width:0}
.slot .iconbtn{min-height:46px}

.wk{margin-bottom:16px}
.wk h3{font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:6px}
.wkbox{background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;gap:1px}
.drow{display:grid;grid-template-columns:4.6rem minmax(0,1fr);gap:1px}
.dd{background:var(--surface);padding:8px 4px;font-size:.74rem;text-align:center;display:flex;flex-direction:column;justify-content:center;font-variant-numeric:tabular-nums}
.dd b{font-size:.8rem}
.dd span{color:var(--muted)}
.dx{background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:6px;min-height:2.8rem;justify-content:center}
.dd.tod,.dx.tod{background:var(--today)}
.dx.none::before{content:"—";color:var(--line);text-align:center}
.xb{display:flex;flex-direction:column;align-items:flex-start;text-align:start;gap:1px;padding:7px 10px;border:0;border-radius:8px;width:100%;cursor:pointer;overflow-wrap:anywhere}
.xb b{font-size:.9rem}
.xb span{font-size:.75rem;opacity:.92}
.xb.dashed{background:transparent;border:1.5px dashed currentColor}
.tg{font-size:.68rem;padding:0 7px;border-radius:999px;background:rgba(127,127,127,.22);margin-inline-start:6px;font-weight:500;white-space:nowrap}
.next{display:flex;flex-direction:column;gap:2px;background:var(--today);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.next small{color:var(--muted);font-size:.75rem}
.next b{font-size:.95rem}
.period{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;font-size:.88rem}
.period span{color:var(--muted)}

.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.thumb{max-width:100%;max-height:14rem;border-radius:10px;border:1px solid var(--line);object-fit:contain;align-self:center}
.res-h{display:flex;align-items:center;gap:10px;justify-content:space-between}
.res-h label{display:flex;align-items:center;gap:8px;font-size:.95rem;min-width:0;overflow-wrap:anywhere}
.res .two{margin-top:2px}
.res label.f{display:flex;flex-direction:column;gap:4px;font-size:.75rem;color:var(--muted)}
.res .e{color:var(--danger);font-size:.82rem;font-weight:500}
details.raw summary{cursor:pointer;font-size:.85rem;color:var(--muted)}
details.raw pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.78rem;margin:8px 0 0;max-height:14rem;overflow:auto;direction:ltr;text-align:left}

.ov{position:fixed;inset:0;background:rgba(10,15,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:34rem;background:var(--surface);color:var(--fg);border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.sh-h{display:flex;align-items:center;gap:10px}
.sh-h h2{font-size:1.15rem;font-weight:600;overflow-wrap:anywhere}
.kv li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.kv li:last-child{border-bottom:0}
.kv li span:last-child{text-align:end;color:var(--muted)}
.row{display:flex;gap:10px}
.row .btn{flex:1}

.dov{position:fixed;inset:0;background:rgba(10,15,22,.55);z-index:30}
.drawer{position:absolute;top:0;bottom:0;inset-inline-start:0;width:min(82vw,20rem);background:var(--surface);color:var(--fg);padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:4px;overflow-y:auto;transform:translateX(100%)}
html[dir="ltr"] .drawer{transform:translateX(-100%)}
.drawer.open,html[dir="ltr"] .drawer.open{transform:none}
.dr-h{display:flex;align-items:center;gap:12px;padding:4px 8px 16px}
.dr-h b{font-family:var(--font-display);font-size:1.2rem;font-weight:600}
.dr-item{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:10px;border:0;background:transparent;width:100%;text-align:start;cursor:pointer;font-weight:500}
.dr-item[aria-current="page"]{background:var(--today);color:var(--accent)}
.dr-sep{height:1px;background:var(--line);margin:8px 4px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:60;max-width:90%;text-align:center}

#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 38%,#16222e 0%,#0a0d12 60%,#000 100%);color:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
.sp-stage{display:flex;flex-direction:column;align-items:center;gap:6px;perspective:900px;text-align:center;padding:0 24px}
.sp-orbit{position:relative;width:min(56vw,220px);height:min(56vw,220px);transform-style:preserve-3d;display:flex;align-items:center;justify-content:center}
.sp-ring{position:absolute;inset:-14%;border-radius:50%;border:2px solid rgba(60,196,178,.55);transform:rotateX(72deg);box-shadow:0 0 24px rgba(60,196,178,.35)}
.sp-ring.r2{inset:-28%;border-color:rgba(130,150,255,.4);transform:rotateX(72deg) rotateY(40deg)}
html:not(.fx) .sp-ring{display:none}
.sp-logo{width:100%;height:100%;border-radius:22%;box-shadow:0 24px 50px -10px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.08)}
.sp-w{font-family:var(--font-display);font-size:2.1rem;line-height:1.2;margin-top:30px}
.sp-s{color:#aab4c2;font-size:.95rem}

/* ---------- 3D scene behind the app ---------- */
#bg3d{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;perspective:800px;display:none}
html.fx #bg3d{display:block}
#bg3d .sc{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(calc(var(--py,0)*-5deg)) rotateY(calc(var(--px,0)*7deg));transition:transform .3s ease-out}
.orb{position:absolute;border-radius:50%;filter:blur(36px);opacity:.5}

  /* ---- dates and times ---- */
  function pad(n){return (n<10?'0':'')+n;}
  function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function pd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null;}
  function utc(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return Date.UTC(+m[1],+m[2]-1,+m[3]);}
  function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d);}
  function diffD(a,b){return Math.round((utc(b)-utc(a))/86400000);}
  function absDay(s){return (pd(s).getDay()+1)%7;}
  function fmtD(s){var d=pd(s);return d?pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear():'';}
  function fmtDM(s){var d=pd(s);return d?pad(d.getDate())+'/'+pad(d.getMonth()+1):'';}

  function normN(s){

  }
  function normC(s){return String(s||'').toUpperCase().replace(/[\s\-_.]/g,'');}
  function sameCourse(a,b){
    if(a.code&&b.code&&normC(a.code)===normC(b.code)) return true;

  /* ================= conflicts and duplicates ================= */
  function ov(a,b){return a.d===b.d&&!(a.e<b.s||b.e<a.s);}

  function findLecConflict(lecs,ignoreId){
    for(var i=0;i<lecs.length;i++){
      for(var j=i+1;j<lecs.length;j++)if(ov(lecs[i],lecs[j]))return {a:lecs[i],b:lecs[j],self:true};
      for(var k=0;k<S.courses.length;k++){
        var c=S.courses[k];if(c.id===ignoreId)continue;
        for(var m=0;m<c.lec.length;m++)if(ov(lecs[i],c.lec[m]))return {a:lecs[i],b:c.lec[m],course:c};
      }
    }
    return null;
  }
  function dupCourse(cand,ignoreId){

    return null;
  }

    var all=S.exams.filter(function(e){return e.id!==cand.id;}).concat(extra||[]);
    for(var i=0;i<all.length;i++)if(all[i].type===cand.type&&sameCourse(all[i],cand))return all[i];
    return null;
  }
  function examConflict(cand,extra){
    var all=S.exams.filter(function(e){return e.id!==cand.id;}).concat(extra||[]);
    for(var i=0;i<all.length;i++){var e=all[i];
      if(e.date===cand.date&&e.s!=null&&cand.s<e.e&&e.s<cand.e)return e;}
    return null;
  }
  function validateExam(c,extra){

    if(c.e<=c.s)return T.errXOrder;
    var d=dupExam(c,extra);if(d)return T.errDupExam(c.name,typeLbl(c.type));
    var cf=examConflict(c,extra);if(cf)return T.errXConflict(cf.name,fmtT(cf.s)+' – '+fmtT(cf.e));
    return '';
  }

  /* ================= exam list ================= */
  function allExams(){
    var list=S.exams.map(function(e){return Object.assign({},e,{manual:true});});
    S.courses.forEach(function(c){
      ['mid','fin'].forEach(function(k){
        if(!c[k])return;
        var has=S.exams.some(function(e){return e.type===k&&sameCourse(e,c);});
        if(!has)list.push({id:'d:'+c.id+':'+k,name:c.name,code:c.code,type:k,date:c[k],s:null,e:null,room:'',note:c.note||'',derived:true,cid:c.id});
      });
    });
    list.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:((a.s==null?9999:a.s)-(b.s==null?9999:b.s));});
    return list;
  }

      var pend=await L.getPending();
      if(pend&&pend.notifications&&pend.notifications.length)await L.cancel({notifications:pend.notifications.map(function(n){return {id:n.id};})});
      var list=[],id=1,common={channelId:'reminders',smallIcon:'ic_stat_schedule',iconColor:'#0E7C70'};
      function mk(k,name,when,defTitle,rest,note){
        var n=P.n[k],cu=n.mode==='custom'&&n.text&&n.text.trim();
        var title=cu?n.text.replace(/\{name\}/g,name).replace(/\{when\}/g,when||'').trim():defTitle;
        return {title:title,body:(cu?name+(when?' · '+when:'')+' · ':'')+rest+(note?'\n'+note:'')};
      }
      if(P.n.lec.on&&!S.sample){
        S.courses.forEach(function(c){
          c.lec.forEach(function(l){
            var sl=S.cfg.slots[l.s],el=S.cfg.slots[l.e];if(!sl||!el)return;
            P.n.lec.offs.forEach(function(off){
              var t=sl.s-off,shift=Math.floor(t/1440),mm=((t%1440)+1440)%1440;
              var absd=((l.d+shift)%7+7)%7,when=off===0?T.nNow:T.nAfter(dur(off));
              var m=mk('lec',c.name,when,T.nLecT(c.name,off===0?null:dur(off)),fmtT(sl.s)+' – '+fmtT(el.e)+(l.room?' · '+T.roomLbl(l.room):''),c.note);
              list.push(Object.assign({id:id++,title:m.title,body:m.body,
                schedule:{on:{weekday:wdOf(absd),hour:Math.floor(mm/60),minute:mm%60},allowWhileIdle:true}},common));
            });
          });
        });
      }
      if(P.n.exam.on){
        var now=Date.now();
        allExams().forEach(function(x){
          if(x.sample)return;
          var d=pd(x.date);if(!d)return;
          if(x.s==null){
            var at=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1,20,0,0);
            if(at.getTime()>now){
              var m0=mk('exam',x.name+' ('+typeLbl(x.type)+')','',T.nExamDayBefore(x.name,typeLbl(x.type)),fmtD(x.date),x.note);
              list.push(Object.assign({id:id++,title:m0.title,body:m0.body,schedule:{at:at,allowWhileIdle:true}},common));
            }
          }else{
            P.n.exam.offs.forEach(function(off){
              var at=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,x.s-off,0);
              if(at.getTime()<=now)return;
              var m1=mk('exam',x.name+' ('+typeLbl(x.type)+')',off===0?T.nNow:T.nAfter(dur(off)),T.nExamT(x.name,typeLbl(x.type),off===0?null:dur(off)),
                fmtD(x.date)+' · '+fmtT(x.s)+' – '+fmtT(x.e)+(x.room?' · '+T.roomLbl(x.room):''),x.note);
              list.push(Object.assign({id:id++,title:m1.title,body:m1.body,schedule:{at:at,allowWhileIdle:true}},common));
            });
          }
        });
      }
      list=list.slice(0,450);
      if(list.length)await L.schedule({notifications:list});
    }catch(e){}
  }
  async function initNative(){
    var L=LN();if(!L)return;NS.native=true;

      var p=await L.checkPermissions();
      if(p.display==='prompt'||p.display==='prompt-with-rationale')p=await L.requestPermissions();
      NS.perm=p.display;
      await L.createChannel({id:'reminders',name:'Reminders',description:'Lecture and exam reminders',importance:5,visibility:1,vibration:true,lights:true});
      try{var x=await L.checkExactNotificationSetting();NS.exact=x.exact_alarm;}catch(e){}
    }catch(e){}
    scheduleNotifs();
    if(view==='notif')render();
  }

  async function openExact(){

  async function testNotif(){

      toast(T.nTestSent);
    }catch(e){toast(T.nPermNo);}
  }

  function logo(cls){return '<img class="'+cls+'" src="'+TILE_SRC+'" alt="" width="40" height="40">';}
  var IC={
    menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
    cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    exam:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 13l2 2 4-4"/>',
    plus:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
    bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/>',
    gear:'<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>',
    back:'<path d="M9 6l6 6-6 6"/>'
  };
  function svg(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';}
  function topMain(title,sub){
    return '<header class="top"><button class="iconbtn" data-act="drawer" aria-label="'+T.menu+'">'+svg('menu')+'</button>'+logo('logo')+
      '<div class="grow"><h1>'+title+'</h1>'+(sub?'<p class="sub">'+sub+'</p>':'')+'</div></header>';
  }
  function topBack(title){
    return '<header class="top"><button class="back" data-act="goback" aria-label="'+T.back+'">'+svg('back')+T.back+'</button><h1>'+title+'</h1></header>';
  }
  function toast(t){
    toastBox.innerHTML='<div class="toast" role="status">'+esc(t)+'</div>';
    clearTimeout(toast._t);toast._t=setTimeout(function(){toastBox.innerHTML='';},2600);
  }
  function closeLayer(){layer.innerHTML='';}

  function drawer(){
    var items=[['main','cal',T.mSchedule],['exams','exam',T.mExams],['wizard','plus',T.mNew],['notif','bell',T.mNotif],['settings','gear',T.mSettings]];
    layer.innerHTML='<div class="dov" data-act="dclose"><nav class="drawer" id="drw" aria-label="'+T.menu+'">'+
      '<div class="dr-h">'+logo('logo')+'<b>'+T.title+'</b></div>'+
      items.map(function(it,i){
        return (i===2?'<div class="dr-sep"></div>':'')+'<button class="dr-item" data-act="nav" data-v="'+it[0]+'"'+(it[0]===view?' aria-current="page"':'')+'>'+svg(it[1])+'<span>'+it[2]+'</span></button>';
      }).join('')+'</nav></div>';
    requestAnimationFrame(function(){requestAnimationFrame(function(){var d=$('drw');if(d)d.classList.add('open');});});
  }
  function sheetWrap(html,label,role){
    layer.innerHTML='<div class="ov" data-act="ovclose"><div class="sheet" role="'+(role||'dialog')+'" aria-label="'+esc(label||'')+'">'+html+'</div></div>';
  }

  /* ================= main schedule ================= */
  function gridHtml(){
    var days=S.cfg.days.slice().sort(function(a,b){return a-b;}),slots=S.cfg.slots,n=slots.length,today=(new Date().getDay()+1)%7;
    var g='<div class="corner" style="grid-row:1;grid-column:1"></div>';
    slots.forEach(function(sl,i){g+='<div class="th" style="grid-row:1;grid-column:'+(i+2)+'"><b>'+fmtT(sl.s)+'</b><span>'+fmtT(sl.e)+'</span></div>';});
    days.forEach(function(d,r){
      g+='<div class="dh'+(d===today?' tod':'')+'" style="grid-row:'+(r+2)+';grid-column:1">'+dayName(d)+'</div>';
      for(var s=0;s<n;s++)g+='<div class="cell'+(d===today?' tod':'')+'" style="grid-row:'+(r+2)+';grid-column:'+(s+2)+'"></div>';
    });
    S.courses.forEach(function(c){
      c.lec.forEach(function(l){
        var r=days.indexOf(l.d);if(r<0||!slots[l.s]||!slots[l.e])return;
        g+='<button class="block c'+c.color+'" data-act="sheet" data-id="'+c.id+'" style="grid-row:'+(r+2)+';grid-column:'+(l.s+2)+' / span '+(l.e-l.s+1)+'">'+esc(c.name)+(l.room?'<small>'+esc(l.room)+'</small>':'')+'</button>';
      });
    });
    return '<div class="grid" style="grid-template-columns:3.4rem repeat('+n+',minmax(4.8rem,1fr));grid-template-rows:3rem repeat('+days.length+',minmax(3.9rem,auto));min-width:'+(3.4+n*4.8)+'rem">'+g+'</div>';
  }
  function renderMain(){
    var list=S.courses.map(function(c){
      var ls=c.lec.slice().sort(function(a,b){return a.d-b.d||a.s-b.s;}).map(function(l){var sl=S.cfg.slots[l.s];return dayName(l.d)+(sl?' '+fmtT(sl.s):'');}).join(' · ');
      return '<button class="crs" data-act="sheet" data-id="'+c.id+'"><span class="bar c'+c.color+'"></span><span class="crs-t"><span class="crs-n">'+esc(c.name)+(c.code?' <span class="crs-m">'+esc(c.code)+'</span>':'')+'</span><span class="crs-l">'+esc(ls)+'</span></span></button>';
    }).join('');
    app.innerHTML=topMain(T.title,T.sub)+
      (S.sample?'<div class="note">'+T.sample+'</div>':'')+
      '<div class="acts"><button class="btn primary" data-act="new">'+T.newSched+'</button><button class="btn" data-act="add">'+T.addCourse+'</button></div>'+
      '<div class="gridbox"><div class="scroll">'+gridHtml()+'</div>'+(S.courses.length?'':'<p class="empty">'+T.empty+'</p>')+'</div>'+
      (S.cfg.slots.length>3?'<p class="hint">'+T.hint+'</p>':'')+
      (S.courses.length?'<section class="sec"><h3>'+T.courses+' ('+S.courses.length+')</h3>'+list+'</section>':'');
  }
  function courseSheet(id){
    var c=S.courses.filter(function(x){return x.id===id;})[0];if(!c)return;
    var ls=c.lec.slice().sort(function(a,b){return a.d-b.d||a.s-b.s;});
    var info=[];
    if(c.code)info.push('<li><span>'+T.code+'</span><span>'+esc(c.code)+'</span></li>');
    if(c.note)info.push('<li><span>'+T.note+'</span><span>'+esc(c.note)+'</span></li>');
    if(c.mid)info.push('<li><span>'+T.midDate+'</span><span>'+fmtD(c.mid)+'</span></li>');
    if(c.fin)info.push('<li><span>'+T.finDate+'</span><span>'+fmtD(c.fin)+'</span></li>');
    sheetWrap('<div class="sh-h"><span class="dot c'+c.color+'"></span><h2>'+esc(c.name)+'</h2></div>'+
      (info.length?'<ul class="kv">'+info.join('')+'</ul>':'')+
      '<ul class="kv">'+ls.map(function(l){
        var sl=S.cfg.slots[l.s],el=S.cfg.slots[l.e];
        return '<li><span>'+dayName(l.d)+(l.room?' · '+esc(l.room):'')+'</span><span>'+(sl&&el?T.span(fmtT(sl.s),fmtT(el.e)):'')+'</span></li>';
      }).join('')+'</ul>'+
      '<div class="row"><button class="btn" data-act="edit" data-id="'+c.id+'">'+T.edit+'</button><button class="btn danger" data-act="askdel" data-id="'+c.id+'">'+T.del+'</button></div>'+

  function submitCourse(){
    var name=nameEl.value.trim(),code=$('code').value.trim(),mid=$('mid').value,fin=$('fin').value,n=+countEl.value,raw=rawLecs(),cnote=$('cnote').value.trim();
    if(!name)return showErr(T.errName);
    var dup=dupCourse({name:name,code:code},fm.id);if(dup)return showErr(T.errDupCourse(name));
    if(mid&&fin&&fin<mid)return showErr(T.errMidFin);
    if(!n)return showErr(T.errCount);
    for(var i=0;i<raw.length;i++)if(raw[i].d===''||raw[i].s===''||raw[i].e==='')return showErr(T.errFill(i+1));
    var lecs=raw.map(function(r){return {d:+r.d,s:+r.s,e:+r.e,room:r.room.trim()};});
    var cf=findLecConflict(lecs,fm.id);
    if(cf){
      if(cf.self)return showErr(T.conflictSelf(lecRange(cf.a),lecRange(cf.b)));
      return showErr(T.conflict(lecRange(cf.a),cf.course.name,lecRange(cf.b)));
    }
    if(fm.mode==='edit'){
      var c=S.courses.filter(function(x){return x.id===fm.id;})[0];
      c.name=name;c.code=code;c.note=cnote;c.mid=mid;c.fin=fin;c.lec=lecs;changed();toast(T.tEdit);go('main');
    }else{
      S.courses.push({id:uid('c'),name:name,code:code,note:cnote,mid:mid,fin:fin,color:nextColor(),lec:lecs});
      changed();toast(T.tAdd(name));
      nameEl.value='';$('code').value='';$('mid').value='';$('fin').value='';$('cnote').value='';countEl.value='';lecsEl.innerHTML='';errEl.hidden=true;renderAdded();nameEl.focus();
    }
  }

  function createSchedule(){
    var days=W.days.slice().sort(function(a,b){return a-b;});
    var slots=W.slots.map(function(s){return {s:s.s,e:s.e};});
    function fail(m){W.err=m;renderWizard();var e=$('err');if(e)e.scrollIntoView({block:'center'});}
    if(!days.length)return fail(T.errWDays);
    if(!slots.length)return fail(T.errWSlots);
    for(var i=0;i<slots.length;i++){if(slots[i].s==null||slots[i].e==null||slots[i].e<=slots[i].s)return fail(T.errWTime(i+1));}
    slots.sort(function(a,b){return a.s-b.s;});
    for(var j=1;j<slots.length;j++){if(slots[j].s<slots[j-1].e)return fail(T.errWOverlap(j,j+1));}
    S.cfg={days:days,slots:slots};S.courses=[];S.sample=false;purgeSampleExams();
    changed();toast(T.wCreate);openForm('new');
  }

  function xBlock(x){
    var col=colorOf(x.name,x.code);

    return '<button class="xb c'+col+(x.derived?' dashed':'')+'" data-act="xsheet" data-id="'+esc(x.id)+'"><b>'+esc(x.name)+'<span class="tg">'+typeLbl(x.type)+'</span></b><span>'+tm+(x.room?' · '+esc(x.room):'')+'</span></button>';
  }
  function renderExams(){
    var list=allExams(),per=S.period,ds=list.map(function(x){return x.date;});
    if(per.from)ds.push(per.from);if(per.to)ds.push(per.to);ds.sort();
    var t=todayS(),now=new Date(),nowMin=now.getHours()*60+now.getMinutes();
    var up=list.filter(function(x){return x.date>t||(x.date===t&&(x.e==null||x.e>nowMin));})[0];
    var banner='';
    if(up){
      var dd=diffD(t,up.date),rel=dd===0?T.xToday:dd===1?T.xTomorrow:T.xInDays(dd);
      banner='<div class="next"><small>'+T.xNext+'</small><b>'+esc(up.name)+' · '+typeLbl(up.type)+'</b><span>'+rel+' · '+dayName(absDay(up.date))+' '+fmtD(up.date)+(up.s!=null?' · '+fmtT(up.s):'')+'</span></div>';
    }
    var body='';
    if(ds.length){
      var from=ds[0],to=ds[ds.length-1];
      if(diffD(from,to)>400)to=addD(from,400);
      var hasP=!!(per.from&&per.to),exDates={};
      list.forEach(function(x){exDates[x.date]=true;});
      var wkStart=addD(from,-absDay(from)),wn=1;
      while(wkStart<=to&&wn<=40){
        var days=[],wkEx=[];
        for(var i=0;i<7;i++){var dd0=addD(wkStart,i);if(exDates[dd0])wkEx.push(dd0);}
        for(var j=0;j<7;j++){
          var dy=addD(wkStart,j),inP=hasP&&dy>=per.from&&dy<=per.to;
          var inEx=wkEx.length&&!hasP&&dy>=wkEx[0]&&dy<=wkEx[wkEx.length-1];
          if(inP||exDates[dy]||inEx)days.push({d:dy,i:j});
        }
        if(days.length){
          var rows=days.map(function(o){
            var xs=list.filter(function(x){return x.date===o.d;}),tod=o.d===t;
            return '<div class="drow"><div class="dd'+(tod?' tod':'')+'"><b>'+dayName(o.i)+'</b><span>'+fmtDM(o.d)+'</span></div><div class="dx'+(tod?' tod':'')+(xs.length?'':' none')+'">'+xs.map(xBlock).join('')+'</div></div>';
          }).join('');
          body+='<section class="wk"><h3>'+T.xWeek(wn,fmtDM(days[0].d),fmtDM(days[days.length-1].d))+'</h3><div class="wkbox">'+rows+'</div></section>';
          wn++;
        }
        wkStart=addD(wkStart,7);
      }
    }else body='<div class="panel"><p>'+T.xEmpty+'</p></div>';
    app.innerHTML=topMain(T.xTitle,'')+
      '<div class="acts"><button class="btn primary" data-act="xnew">'+T.xAdd+'</button><button class="btn" data-act="xphoto">'+T.xPhoto+'</button></div>'+
      '<div class="period"><div><b>'+T.xPeriod+'</b><br><span>'+(per.from&&per.to?fmtD(per.from)+' – '+fmtD(per.to):T.xPeriodNone)+'</span></div><button class="btn sm" data-act="xperiod">'+T.xPeriodEdit+'</button></div>'+
      banner+body;
  }

  function normDigits(s){
    return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);});
  }
  function codeRegex(code){
    var groups=['O0Q','IL1|!','S5','B8','Z2'];
    var chars=Array.from(normDigits(code).toUpperCase().replace(/[\s\-_.]/g,'')),parts=[];
    chars.forEach(function(c){
      var g=null;for(var i=0;i<groups.length;i++)if(groups[i].indexOf(c)>=0)g=groups[i];
      if(g)parts.push('['+g+']');else parts.push(c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));

  var MONTHS={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12,
    'يناير':1,'فبراير':2,'مارس':3,'أبريل':4,'ابريل':4,'مايو':5,'يونيو':6,'يوليو':7,'أغسطس':8,'اغسطس':8,'سبتمبر':9,'أكتوبر':10,'اكتوبر':10,'نوفمبر':11,'ديسمبر':12};
  var MON_RE='(january|february|march|april|may|june|july|august|september|october|november|december|sept|jan|feb|mar|apr|jun|jul|aug|sep|oct|nov|dec|يناير|فبراير|مارس|أبريل|ابريل|مايو|يونيو|يوليو|أغسطس|اغسطس|سبتمبر|أكتوبر|اكتوبر|نوفمبر|ديسمبر)';
  function findDate(text,todayIso){
    var m,y,t=todayIso||'2026-01-01',ty=+t.slice(0,4);
    function mk(y,mo,d){if(mo<1||mo>12||d<1||d>31)return null;var dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1)return null;return dt.getFullYear()+'-'+('0'+mo).slice(-2)+'-'+('0'+d).slice(-2);}
    function nearYear(mo,d,yy){
      if(yy){if(yy<100)yy+=2000;return mk(yy,mo,d);}
      var r=mk(ty,mo,d);if(!r)return null;
      var diff=(Date.UTC(+r.slice(0,4),+r.slice(5,7)-1,+r.slice(8,10))-Date.UTC(ty,+t.slice(5,7)-1,+t.slice(8,10)))/86400000;
      return diff<-90?mk(ty+1,mo,d):r;
    }
    m=/(\d{4})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{1,2})/.exec(text);
    if(m){var r=mk(+m[1],+m[2],+m[3]);if(r)return {iso:r,text:m[0]};}
    m=/(\d{1,2})\s*[\/\-.]\s*(\d{1,2})\s*[\/\-.]\s*(\d{4}|\d{2})(?!\d)/.exec(text);
    if(m){var r2=nearYear(+m[2],+m[1],+m[3]);if(r2)return {iso:r2,text:m[0]};}
    m=new RegExp('(\\d{1,2})\\s*(?:st|nd|rd|th)?\\s*'+MON_RE+'\\.?,?\\s*(\\d{4})?','i').exec(text);
    if(m){var r3=nearYear(MONTHS[m[2].toLowerCase()],+m[1],m[3]?+m[3]:0);if(r3)return {iso:r3,text:m[0]};}
    m=new RegExp(MON_RE+'\\.?\\s*(\\d{1,2})(?:st|nd|rd|th)?(?!\\d)(?:,?\\s*(\\d{4}))?','i').exec(text);
    if(m){var r4=nearYear(MONTHS[m[1].toLowerCase()],+m[2],m[3]?+m[3]:0);if(r4)return {iso:r4,text:m[0]};}
    m=/(?<![\d:])(\d{1,2})\s*[\/\-]\s*(\d{1,2})(?![\d:\/\-])/.exec(text);
    if(m){var r5=nearYear(+m[2],+m[1],0);if(r5)return {iso:r5,text:m[0]};}

  }
  function findTimes(text){
    var re=/(\d{1,2})\s*[:.]\s*(\d{2})\s*(AM|PM|am|pm|A\.M\.|P\.M\.|ص|م)?/g,m,out=[];
    while((m=re.exec(text))){
      var h=+m[1],mi=+m[2];if(h>23||mi>59)continue;
      var suf=m[3]?m[3].toLowerCase().replace(/\./g,''):'';
      if(suf==='pm'||suf==='م'){if(h<12)h+=12;}
      else if(suf==='am'||suf==='ص'){if(h===12)h=0;}
      else if(h>=1&&h<=6)h+=12;
      out.push({min:h*60+mi,text:m[0]});
    }
    return out;
  }
  function findRoom(text){
    var m=/(?:قاعة|القاعة|قاعه|مدرج|معمل|مختبر|hall|room|rm|lab|amphi|theat(?:er|re))\.?\s*[:\-]?\s*([A-Za-z0-9\u0600-\u06FF]+(?:[\-\/][A-Za-z0-9]+)?)/i.exec(text);
    return m?m[0].replace(/\s+/g,' ').trim():'';
  }
  function parseExamText(text,codes,todayIso){
    var lines=normDigits(text).split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
    var res=[];
    codes.forEach(function(code){
      var re=codeRegex(code),out={code:code,found:false,date:'',s:'',e:'',room:'',guessEnd:false,line:''};
      if(!re){res.push(out);return;}
      var idx=-1;
      for(var i=0;i<lines.length;i++){if(re.test(lines[i])){idx=i;break;}}
      if(idx<0){res.push(out);return;}
      out.found=true;out.line=lines[idx];
      var line=lines[idx].replace(re,' ');
      var dt=findDate(line,todayIso);
      if(!dt){
        for(var k=idx-1;k>=0&&k>=idx-10;k--){dt=findDate(lines[k],todayIso);if(dt)break;}
      }
      var rest=line;
      if(dt){out.date=dt.iso;rest=rest.replace(dt.text,' ');}
      var times=findTimes(rest);
      if(!times.length){
        var nb=[lines[idx+1],lines[idx-1]];
        for(var q=0;q<nb.length&&!times.length;q++){if(nb[q]&&!codeRegexAny(nb[q],codes)){times=findTimes(nb[q].replace(dt?dt.text:'',' '));}}
      }
      if(times.length){
        out.s=times[0].min;
        if(times.length>1){out.e=times[1].min;if(out.e<=out.s&&out.e<12*60)out.e+=12*60;if(out.e<=out.s)out.e='';}
        if(out.e===''||times.length===1){out.e=Math.min(out.s+120,23*60+59);out.guessEnd=true;}
        times.forEach(function(tm){rest=rest.replace(tm.text,' ');});
      }
      out.room=findRoom(rest);
      res.push(out);
    });
    return res;
  }
  function codeRegexAny(line,codes){for(var i=0;i<codes.length;i++){var r=codeRegex(codes[i]);if(r&&r.test(line))return true;}return false;}

  function loadScript(src){
    return new Promise(function(res,rej){
      var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=function(){rej(new Error('load'));};document.head.appendChild(s);

  function prepImage(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){
        var w=img.naturalWidth,h=img.naturalHeight,sc=1;
        if(Math.max(w,h)<1800)sc=1800/Math.max(w,h);
        if(Math.max(w,h)*sc>3200)sc=3200/Math.max(w,h);
        var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
        try{x.filter='grayscale(1) contrast(1.2)';}catch(e){}
        x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c);
      };
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'));};
      img.src=url;
    });
  }
  function errMsg(e){return (e&&e.message)||(typeof e==='string'?e:'')||String(e||'');}
  function otsu(src){
    var c=document.createElement('canvas');c.width=src.width;c.height=src.height;
    var x=c.getContext('2d');x.drawImage(src,0,0);
    var d=x.getImageData(0,0,c.width,c.height),px=d.data,hist=new Array(256).fill(0),i,n=px.length/4;
    for(i=0;i<px.length;i+=4)hist[px[i]]++;

    var sB=0,wB=0,mx=0,th=127;
    for(i=0;i<256;i++){wB+=hist[i];if(!wB)continue;var wF=n-wB;if(!wF)break;sB+=i*hist[i];var mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>mx){mx=v;th=i;}}

    x.putImageData(d,0,0);return c;
  }
  async function makeWorker(langs,logger){
    var base={workerPath:'vendor/tesseract/worker.min.js',corePath:'vendor/tesseract-core',langPath:'vendor/tessdata',cacheMethod:'none',gzip:true,logger:logger};
    try{return await Tesseract.createWorker(langs,1,base);}

    var worker=null;
    try{
      if(typeof Tesseract==='undefined')await loadScript('vendor/tesseract/tesseract.min.js');
      var gray=await prepImage(O.file),bin=null;

      worker=await makeWorker(O.ara?'eng+ara':'eng',logger);
      var passes=[['6',false],['4',true],['11',false]],best={},raw='';
      for(var pi=0;pi<passes.length;pi++){
        O.pass=T.oPass(pi+1,passes.length);O.pct=0;
        var t0=$('ptxt');if(t0)t0.textContent=O.pass+' · '+T.oReading(0);
        try{await worker.setParameters({tessedit_pageseg_mode:passes[pi][0],preserve_interword_spaces:'1'});}catch(e){}

        var p=best[code]||{code:code,found:false,date:'',s:'',e:'',room:'',guessEnd:false};
        var c=courseFor('',code),name=c?c.name:code;
        return {code:code,name:name,found:p.found,date:p.date,s:p.s===''?'':toHM(p.s),e:p.e===''?'':toHM(p.e),room:p.room,guess:p.guessEnd,inc:p.found,err:''};

  }

  function wheelInit(id,idx){
    var w=$(id),q=0;

      var st=w.scrollTop;

    w.addEventListener('scroll',function(){if(!q)q=requestAnimationFrame(function(){q=0;paint();});});
    w.addEventListener('click',function(e){var it=e.target.closest('.wi');if(it)w.scrollTo({top:(+it.getAttribute('data-i'))*44,behavior:'smooth'});});

  function pkTime(el){

      '<div class="row"><button type="button" class="btn primary" data-pa="ok">'+T.pkDone+'</button><button type="button" class="btn" data-pa="cancel">'+T.cancel+'</button></div>');
